<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO principal -->
    <title>Menú Digital QR para Restaurantes | Menú Digital App</title>

    <meta
      name="description"
      content="Creá un menú digital QR para tu restaurante, bar o cafetería. Actualizá productos, precios y ofertas al instante y compartí tu carta desde cualquier celular."
    />

    <meta name="robots" content="index, follow" />

    <link
      rel="canonical"
      href="https://www.menudigitalapp.com.ar/"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="/brand/menu-digital-logo-mark.svg"
    />

    <!-- Navegador / Mobile -->
    <meta name="theme-color" content="#0a0608" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Menú Digital App" />

    <meta
      property="og:url"
      content="https://www.menudigitalapp.com.ar/"
    />

    <meta
      property="og:title"
      content="Menú Digital QR para Restaurantes | Menú Digital App"
    />

    <meta
      property="og:description"
      content="Creá un menú digital QR para tu restaurante, bar o cafetería. Actualizá productos, precios y ofertas al instante y compartí tu carta desde cualquier celular."
    />

    <meta
      property="og:image"
      content="https://www.menudigitalapp.com.ar/brand/menu-digital-logo-mark.svg"
    />

    <meta
      property="og:image:alt"
      content="Menú Digital App - Menús digitales QR para restaurantes"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Menú Digital QR para Restaurantes | Menú Digital App"
    />

    <meta
      name="twitter:description"
      content="Creá un menú digital QR para tu restaurante, bar o cafetería. Actualizá productos, precios y ofertas al instante."
    />

    <meta
      name="twitter:image"
      content="https://www.menudigitalapp.com.ar/brand/menu-digital-logo-mark.svg"
    />

    <meta
      name="twitter:image:alt"
      content="Menú Digital App - Menús digitales QR para restaurantes"
    />

    <!-- Datos estructurados -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://www.menudigitalapp.com.ar/#organization",
            "name": "Menú Digital App",
            "url": "https://www.menudigitalapp.com.ar/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://www.menudigitalapp.com.ar/brand/menu-digital-logo-mark.svg"
            },
            "description": "Plataforma para crear menús digitales QR para restaurantes, bares y cafeterías.",
            "areaServed": {
              "@type": "Country",
              "name": "Argentina"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://www.menudigitalapp.com.ar/#website",
            "url": "https://www.menudigitalapp.com.ar/",
            "name": "Menú Digital App",
            "inLanguage": "es-AR",
            "publisher": {
              "@id": "https://www.menudigitalapp.com.ar/#organization"
            }
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://www.menudigitalapp.com.ar/#software",
            "name": "Menú Digital App",
            "url": "https://www.menudigitalapp.com.ar/",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "inLanguage": "es-AR",
            "description": "Plataforma web para crear menús digitales QR para restaurantes, bares y cafeterías. Permite administrar productos, precios, ofertas y disponibilidad desde un panel online.",
            "provider": {
              "@id": "https://www.menudigitalapp.com.ar/#organization"
            },
            "areaServed": {
              "@type": "Country",
              "name": "Argentina"
            }
          }
        ]
      }
    </script>

    <!-- Tema claro/oscuro -->
    <script>
      (function () {
        try {
          if (localStorage.getItem("panel-theme") === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
