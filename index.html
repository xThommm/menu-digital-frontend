<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/menu-digital-app-favicon-source-v2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menú Digital</title>
    <script>
      // Aplica el tema del panel (claro/oscuro) ANTES de pintar, para no
      // mostrar un flash del tema equivocado al recargar. Solo escribe el
      // atributo si el guardado es "light"; "dark" es el default sin atributo.
      // Ver src/hooks/useTheme.ts.
      (function () {
        try {
          if (localStorage.getItem("panel-theme") === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
