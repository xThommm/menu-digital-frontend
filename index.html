<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO principal -->
    <title>Menú Digital QR para Restaurantes | Menú Digital App</title>

    <meta
      name="description"
      content="Creá un menú digital QR para tu restaurante, bar o cafetería. Actualizá productos, precios y ofertas al instante y compartí tu carta desde cualquier celular."
    />

    <meta name="robots" content="index, follow" />

    <link
      rel="canonical"
      href="https://www.menudigitalapp.com.ar/"
    />

    <!-- Favicon -->
    <!-- Google Search no soporta SVG para el favicon de resultados: se agregan PNG/ICO como fuente principal -->
    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="/favicon-96x96.png"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/brand/menu-digital-logo-mark.svg"
    />

    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />

    <!-- Navegador / Mobile -->
    <meta name="theme-color" content="#0a0608" />

    <!-- Fuentes: como <link> y no como @import dentro del CSS del bundle, para
         que el navegador las pida en paralelo con el JS/CSS en vez de esperar
         a que llegue el bundle. Poppins: plataforma. DM Sans + Playfair
         Display: cartas públicas ([data-template]). Archivo Black + Space
         Grotesk (Neobrutalismo) y Bagel Fat One + Figtree + Instrument Serif
         (Maximalismo táctil): el navegador solo descarga los archivos de una
         fuente cuando algún texto la usa, así que las páginas que no las usan
         pagan únicamente las declaraciones @font-face. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900;1,300;1,400;1,500;1,600;1,700;1,900&family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Bagel+Fat+One&family=Figtree:wght@500;700;800&family=Instrument+Serif:ital@1&display=swap"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Menú Digital App" />

    <meta
      property="og:url"
      content="https://www.menudigitalapp.com.ar/"
    />

    <meta
      property="og:title"
      content="Menú Digital QR para Restaurantes | Menú Digital App"
    />

    <meta
      property="og:description"
      content="Creá un menú digital QR para tu restaurante, bar o cafetería. Actualizá productos, precios y ofertas al instante y compartí tu carta desde cualquier celular."
    />

    <!-- 1200×630 (fuente en docs/og-image.html). Ancho y alto declarados para
         que Facebook/WhatsApp la muestren desde el primer compartido, sin
         esperar a descargarla. -->
    <meta
      property="og:image"
      content="https://www.menudigitalapp.com.ar/brand/menu-digital-og.jpg"
    />

    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta
      property="og:image:alt"
      content="Menú Digital App - Menús digitales QR para restaurantes"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Menú Digital QR para Restaurantes | Menú Digital App"
    />

    <meta
      name="twitter:description"
      content="Creá un menú digital QR para tu restaurante, bar o cafetería. Actualizá productos, precios y ofertas al instante."
    />

    <meta
      name="twitter:image"
      content="https://www.menudigitalapp.com.ar/brand/menu-digital-og.jpg"
    />

    <meta
      name="twitter:image:alt"
      content="Menú Digital App - Menús digitales QR para restaurantes"
    />

      (function () {
        try {
          if (localStorage.getItem("panel-theme") === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>
  </head>
